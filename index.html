<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Timetable | Computer Engineering</title>
  <meta name="description" content="Department of Computer Engineering Class Timetables" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231f2937'/><text y='50' x='50' font-family='sans-serif' font-size='50' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'>CE</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #ffffff;
      padding: 32px 24px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }

    .header p {
      color: #6b7280;
      font-size: 0.95rem;
    }

    .main-content {
      flex: 1;
      padding: 48px 24px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .class-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      padding: 24px;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .class-card:hover {
      border-color: #2563eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      transform: translateY(-2px);
    }

    .class-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }

    .class-room {
      font-size: 0.875rem;
      color: #6b7280;
    }

    .footer {
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      padding: 24px;
      text-align: center;
    }

    .footer-text {
      color: #9ca3af;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social-links a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.75rem;
      transition: color 0.15s;
    }

    .social-links a:hover {
      color: #4b5563;
    }

    @media (max-width: 640px) {
      .main-content { padding: 32px 16px; }
      .class-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Department Timetable Viewer</h1>
    <p>Computer Engineering Program</p>
  </header>

  <main class="main-content">
    <div class="class-grid">
      <a href="se1.html" class="class-card">
        <span class="class-name">SE-1</span>
        <span class="class-room">Room E201</span>
      </a>
      <a href="se2.html" class="class-card">
        <span class="class-name">SE-2</span>
        <span class="class-room">Room E202</span>
      </a>
      <a href="te1.html" class="class-card">
        <span class="class-name">TE-1</span>
        <span class="class-room">Room E203</span>
      </a>
      <a href="te2.html" class="class-card">
        <span class="class-name">TE-2</span>
        <span class="class-room">Room E204</span>
      </a>
      <a href="be.html" class="class-card">
        <span class="class-name">BE</span>
        <span class="class-room">Room E204</span>
      </a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-text">
      Maintained by Swaraj Shelke
      <div class="social-links">
        <a href="https://github.com/swarajshelke12" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/swaraj-shelke-0a3a752b8/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.instagram.com/swarajshelke12" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </footer>
</body>
</html>
